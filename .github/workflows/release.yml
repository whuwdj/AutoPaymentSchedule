name: Build Windows-Compatible Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5  # 👈 升级到 v5，彻底消除 Node 警告

      - name: Install 7-Zip
        run: sudo apt-get install -y p7zip-full

      - name: Create Windows-compatible ZIP
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          7z a -tzip -mx=9 -mcu=on "智能排款系统_v${VERSION}_Windows兼容版.zip" ./ \
            -x!".git" \
            -x!".github" \
            -x!".gitattributes" \
            -x!".gitignore" \
            -x!"__MACOSX" \
            -x!".DS_Store"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: "智能排款系统_v*_Windows兼容版.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}