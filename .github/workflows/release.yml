name: Build Windows-Compatible Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v开头的标签时触发（如 v1.0.0）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: sudo apt-get install -y p7zip-full

      - name: Create Windows-compatible ZIP
        run: |
          # 获取版本号（去掉tag前面的v）
          VERSION=${GITHUB_REF_NAME#v}
          # 用7-Zip创建兼容Windows的ZIP包（UTF-8编码）
          7z a -tzip -mx=9 -mcu=on "智能排款系统_v${VERSION}_Windows兼容版.zip" ./ \
            -x!".git" \
            -x!".github" \
            -x!".gitattributes" \
            -x!".gitignore" \
            -x!"__MACOSX" \
            -x!".DS_Store"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: "智能排款系统_v*_Windows兼容版.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
