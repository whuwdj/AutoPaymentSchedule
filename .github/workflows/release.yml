name: Build Windows-Compatible Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code (强制 UTF-8 防止乱码)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 核心：设置系统编码为 UTF-8，彻底解决 Windows 中文乱码
      - name: Set Windows system encoding to UTF-8
        run: chcp 65001
        shell: cmd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE (Windows 无乱码版本)
        run: |
          pyinstaller --onefile --windowed --console ^
            --name "智能排款系统" ^
            --add-data "./*;./" ^
            --noupx ^
            --clean ^
            --runtime-tmpdir temp ^
            main.py
        shell: cmd

      - name: Create UTF-8 ZIP (Windows 解压不乱码)
        run: |
          7z a -tzip -mx=9 -mcu=on -mcp=65001 "智能排款系统_Windows版_${env:GITHUB_REF_NAME}.zip" .\dist\*
        shell: pwsh

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: "智能排款系统_Windows版_v*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}